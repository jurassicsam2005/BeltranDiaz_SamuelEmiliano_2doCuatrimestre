<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>

<body>
    <h1>Ejercicio 2: Crea un formulario que solicite el nombre de un producto y su precio sin IVA. Al enviar el formulario, se deberá calcular el IVA y mostrar lo siguiente: El monto del IVA (16%) y el precio total con IVA incluido. Muestra los resultados en pantalla</h1>
    <h2>Formulario</h2>
    <form action="ejercicio2.php" method="get">
        <label for="producto">Ingrese el nombre del producto:</label>
        <input type="text" id="producto" name="producto" required><br><br>
        <label for="precio">Ingrese el precio sin IVA:</label>
        <input type="number" id="precio" name="precio" step="0.01" required><br><br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
