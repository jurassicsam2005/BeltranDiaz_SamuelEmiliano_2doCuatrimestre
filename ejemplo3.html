<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Ejemplo 3: Crea un programa que reciba el nombres del usruario, edad, estatura y su peso. El programa debe calcular el IMC, mostrando al usuario si su peso es normal, bajo, sobrepeso, etc.</h1>
    <br>
    <form action="ejemplo3.php" method="GET">
        <label>Nombre: </label>
        <input type="text" name="nombre">
        <label>Edad: </label>
        <input type="number" name="edad"><br>
        <label>Estatura (m): </label>
        <input type="number" step="0.01" name="estatura"><br>
        <label>Peso (kg): </label>
        <input type="number" step="0.01" name="peso"><br>
        <button>Enviar</button>
    </form>
</body>
